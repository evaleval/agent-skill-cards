[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillcard"
dynamic = ["version"]
description = "Generate Skill Cards, documentation cards for agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "black>=26.10.1",
    "ruff>=0.17.4",
]

[project.scripts]
skillcard = "skillcard.cli:main"

[tool.setuptools.dynamic]
version = {attr = "skillcard.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
